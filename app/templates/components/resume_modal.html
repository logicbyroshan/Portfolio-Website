{% load static %}
<!-- Resume PDF Preview Modal -->
<div id="popup" class="popup-overlay" aria-hidden="true" role="dialog" aria-labelledby="resume-modal-title">
    <div class="popup-content">
        <div class="popup-header">
            <h3 id="resume-modal-title">Resume Preview</h3>
            <button type="button" class="close-btn" onclick="closePopup()" title="Close resume preview" aria-label="Close">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>
        
        <div class="popup-body">
            {% if resume and resume.file %}
                <div class="iframe-container">
                    <object data="{{ resume.file.url }}" type="application/pdf" width="100%" height="100%">
                        <embed src="{{ resume.file.url }}" type="application/pdf" width="100%" height="100%" />
                        <p class="no-pdf-fallback">
                            Your browser does not support inline PDF preview. 
                            <a href="{{ resume.file.url }}" target="_blank" rel="noopener noreferrer">Click here to download the PDF</a>
                        </p>
                    </object>
                </div>
                
                <div class="popup-actions">
                    <a href="{{ resume.file.url }}" download class="download-link">
                        <button type="button" class="download-btn">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                            Download PDF Resume
                        </button>
                    </a>
                    <button type="button" class="cancel-btn" onclick="closePopup()">Close</button>
                </div>
            {% else %}
                <div class="no-resume">
                    <p><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px; margin-right: 6px;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>Resume document is currently being updated. Please check back shortly or reach out via the contact form.</p>
                </div>
            {% endif %}
        </div>
    </div>
</div>
