{% load static %}
<!-- Sticky Glassmorphic Navigation Bar -->
<header class="navbar">
    <div class="logo">
        <div class="logo-img">
            <a href="{% url 'home' %}" title="Roshan Damor Portfolio">
                <img src="{% static 'images/stock/Roshan_Logo_White.webp' %}" alt="Roshan Logo">
                <span>Portfolio</span>
            </a>
        </div>
    </div>

    <!-- Desktop Navigation Links (Skills, Experience, Projects, Blogs) -->
    <nav class="nav-items" aria-label="Main Navigation">
        <a href="{% url 'skill_list' %}" class="{% if 'skill' in request.resolver_match.url_name %}active{% endif %}">Skills</a>
        <a href="{% url 'experience_list' %}" class="{% if 'experience' in request.resolver_match.url_name %}active{% endif %}">Experience</a>
        <a href="{% url 'project_list' %}" class="{% if 'project' in request.resolver_match.url_name %}active{% endif %}">Projects</a>
        <a href="{% url 'blog_list' %}" class="{% if 'blog' in request.resolver_match.url_name %}active{% endif %}">Blogs</a>
    </nav>

    <!-- Desktop Resume CTA -->
    <div class="nav-btns">
        <button type="button" class="outline-btn" onclick="openPopup()" title="Preview and download resume">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
            </svg>
            <span>Download Resume</span>
        </button>
    </div>

    <!-- Mobile Navigation Action Area (Resume CTA + Hamburger Menu) -->
    <div class="nav-mob-actions">
        <button type="button" class="nav-mob-resume-btn" onclick="openPopup()" title="Download Resume" aria-label="Resume">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
            </svg>
            <span>CV</span>
        </button>

        <button type="button" class="nav-mob-btn" id="mobile-toggle" aria-label="Toggle navigation menu">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>
    </div>
</header>

<!-- Mobile Navigation Drawer -->
<div class="mobile-nav-overlay" id="mobile-overlay"></div>
<aside class="mobile-nav-panel" id="mobile-panel">
    <div class="mobile-nav-header">
        <div class="logo-img">
            <a href="{% url 'home' %}">
                <img src="{% static 'images/stock/Roshan_Logo_White.webp' %}" alt="Roshan Logo">
                <span>Portfolio</span>
            </a>
        </div>
        <button type="button" class="mobile-nav-close" id="mobile-close" aria-label="Close menu">&times;</button>
    </div>

    <nav class="mobile-nav-links" aria-label="Mobile Navigation">
        <a href="{% url 'home' %}">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            <span>Home</span>
        </a>
        <a href="{% url 'skill_list' %}">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
            <span>Skills</span>
        </a>
        <a href="{% url 'experience_list' %}">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
            <span>Experience</span>
        </a>
        <a href="{% url 'project_list' %}">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
            <span>Projects</span>
        </a>
        <a href="{% url 'blog_list' %}">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
            <span>Blogs</span>
        </a>
        <a href="{% url 'home' %}#faqs-section">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
            <span>FAQs</span>
        </a>
    </nav>

    <div class="mobile-nav-resume">
        <button type="button" class="primary-btn mobile-resume-drawer-btn" onclick="closeMobileNav(); openPopup();">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            <span>Download Resume (PDF)</span>
        </button>
    </div>
</aside>
