{% load static %}
<div class="blog-card blogs-card">
    <div class="blog-image blogs-image">
        {% if blog.image %}
            <img src="{{ blog.image.url }}" alt="{{ blog.title }}" class="blog-cover-img">
        {% else %}
            <img src="{% static 'images/others/Project Image 3.webp' %}" alt="{{ blog.title }}" class="blog-cover-img">
        {% endif %}
    </div>
    <div class="blog-content blogs-content">
        <div class="blog-meta-row">
            <span class="meta-date">
                <img src="{% static 'images/icons/calendar.webp' %}" alt="" class="meta-icon">
                {{ blog.publication_date|date:"M d, Y" }}
            </span>
            <span class="meta-read-time">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -1px; margin-right: 4px;"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>{{ blog.time_to_read }} min read
            </span>
        </div>
        <h2 class="card-title">{{ blog.title }}</h2>
        <div class="blog-categories">
            <span class="cat-label">Category:</span>
            {% for category in blog.get_category_list %}
                <span class="badge-outline">{{ category }}</span>
            {% endfor %}
        </div>
        <div class="blog-card-actions blogs-links">
            <a href="{% url 'blog_detail' slug=blog.slug %}">
                <button class="outline-btn">Read More</button>
            </a>
        </div>
    </div>
</div>
